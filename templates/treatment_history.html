{% extends "base.html" %}

{% block title %}Treatment History - Plant Health Analyzer{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-8">
    <h2 class="text-3xl font-bold mb-6">Treatment History</h2>
    <div id="treatmentContainer" class="space-y-4"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    fetch('/history')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('treatmentContainer');
            data.filter(a => a.disease_name !== 'None').forEach(a => {
                container.innerHTML += `
                    <div class="bg-surface-light dark:bg-surface-dark p-6 rounded-lg shadow">
                        <div class="flex items-start gap-4">
                            <span class="material-icons text-green-600 text-4xl">medical_services</span>
                            <div class="flex-1">
                                <h3 class="text-xl font-semibold mb-2">${a.disease_name}</h3>
                                <p class="text-sm text-gray-500 mb-3">${new Date(a.timestamp).toLocaleString()}</p>
                                <p class="text-gray-700 dark:text-gray-300 mb-3"><strong>Treatment:</strong> ${a.treatment}</p>
                                <p class="text-gray-700 dark:text-gray-300"><strong>Medicines:</strong> ${a.medicines}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
</script>
{% endblock %}
