{% extends "base.html" %}

{% block title %}Profile Settings - Plant Health Analyzer{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-8 max-w-2xl">
    <h2 class="text-3xl font-bold mb-6">Profile Settings</h2>
    
    <div class="bg-surface-light dark:bg-surface-dark p-6 rounded-lg shadow mb-6">
        <div class="flex items-center gap-4 mb-6">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center">
                <span class="material-icons text-green-600 text-4xl">person</span>
            </div>
            <div>
                <h3 class="text-xl font-semibold">User Profile</h3>
                <p class="text-gray-500">Manage your account settings</p>
            </div>
        </div>
        
        <form class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-2">Email</label>
                <input type="email" class="w-full px-4 py-2 border rounded-lg" value="{{ session.get('user', 'user@example.com') }}" readonly>
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2">Full Name</label>
                <input type="text" class="w-full px-4 py-2 border rounded-lg" placeholder="Enter your name">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2">Phone Number</label>
                <input type="tel" class="w-full px-4 py-2 border rounded-lg" placeholder="Enter phone number">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2">Location</label>
                <input type="text" class="w-full px-4 py-2 border rounded-lg" placeholder="City, State">
            </div>
            
            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700">
                Save Changes
            </button>
        </form>
    </div>
    
    <div class="bg-surface-light dark:bg-surface-dark p-6 rounded-lg shadow">
        <h3 class="text-xl font-semibold mb-4">Preferences</h3>
        <div class="space-y-4">
            <div class="flex justify-between items-center">
                <span>Email Notifications</span>
                <input type="checkbox" class="w-12 h-6">
            </div>
            <div class="flex justify-between items-center">
                <span>Dark Mode</span>
                <input type="checkbox" class="w-12 h-6">
            </div>
        </div>
    </div>
</div>
{% endblock %}
